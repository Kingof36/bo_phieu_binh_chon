<script>
// Khai báo đường dẫn Google Apps Script Web App của bạn ở đây
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzfrUqyfxCE6Ds-yhrydFL1GBAtnPI_212pYoZ1NRAphXYVUGLc25mGNUJkxhpguoal1A/exec";

let currentUser = JSON.parse(localStorage.getItem('voter_info')) || null;
let currentData = null;
const ADMIN_PASS = "Tuanvy2009@";

async function loadData() {
    try {
        const res = await fetch(SCRIPT_URL + '?action=getData');
        currentData = await res.json();
        renderUI();
    } catch(e) {
        console.error(e);
    }
}

function renderUI() {
    if (!currentData) return;
    
    document.getElementById('pageTitle').innerText = currentData.settings.title || "Hệ Thống Bình Chọn";
    document.getElementById('adminTitle').value = currentData.settings.title || "";
    document.getElementById('adminBgImage').value = currentData.settings.bgImage || "";
    document.getElementById('adminMaxVotes').value = currentData.settings.maxVotes || 1;
    
    if (currentData.settings.bgImage) {
        document.getElementById('bodyBg').style.backgroundImage = `url('${currentData.settings.bgImage}')`;
    }

    if (currentUser) {
        document.getElementById('userModal').style.display = 'none';
        document.getElementById('voterInfoBox').innerHTML = `Xin chào, <b>${currentUser.name}</b> (Lớp: ${currentUser.studentClass})`;
    } else {
        document.getElementById('userModal').style.display = 'flex';
    }

    // Render danh sách vote
    const grid = document.getElementById('candidatesGrid');
    grid.innerHTML = currentData.candidates.map(c => `
        <div class="card">
            <img src="${c.image || 'https://via.placeholder.com/150'}" alt="${c.name}">
            <h3>${c.name}</h3>
            <p>Số phiếu: <b>${c.votes}</b></p>
            <button class="btn" onclick="vote('${c.id}')">Bình Chọn</button>
        </div>
    `).join('');

    // Render Bảng tổng kết
    renderLeaderboard();

    // Render danh sách trong phần quản trị
    const adminList = document.getElementById('adminCandidatesList');
    adminList.innerHTML = currentData.candidates.map(c => `
        <div style="display: flex; justify-content: space-between; align-items: center; background: #eee; padding: 8px; margin-bottom: 5px; border-radius: 4px;">
            <span><b>${c.name}</b> (${c.votes} phiếu)</span>
            <button class="btn btn-danger" style="padding: 5px 10px;" onclick="deleteCandidate('${c.id}')">Xóa</button>
        </div>
    `).join('');
}

function renderLeaderboard() {
    const container = document.getElementById('leaderboardContainer');
    if (!currentData.candidates.length) {
        container.innerHTML = '<p style="text-align: center; color: #666;">Chưa có dữ liệu tổng kết.</p>';
        return;
    }

    let sorted = [...currentData.candidates].sort((a, b) => b.votes - a.votes);

    container.innerHTML = sorted.map((c, index) => `
        <div class="leaderboard-row">
            <div class="leaderboard-info">
                <span style="font-weight: bold; font-size: 18px; width: 30px;">#${index + 1}</span>
                <img src="${c.image || 'https://via.placeholder.com/55'}" alt="${c.name}">
                <span style="font-size: 16px; font-weight: bold;">${c.name}</span>
            </div>
            <div>
                <span style="background: #2563eb; color: white; padding: 6px 14px; border-radius: 20px; font-weight: bold;">${c.votes} phiếu</span>
            </div>
        </div>
    `).join('');
}

// Lưu thông tin học sinh
document.getElementById('userForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('userName').value.trim();
    const studentClass = document.getElementById('userClass').value.trim();
    if (name && studentClass) {
        currentUser = { name, studentClass };
        localStorage.setItem('voter_info', JSON.stringify(currentUser));
        renderUI();
    }
});

// Gửi vote lên Google Script
async function vote(candidateId) {
    if (!currentUser) return alert('Vui lòng nhập tên và lớp!');
    
    try {
        const res = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({
                action: 'vote',
                name: currentUser.name,
                studentClass: currentUser.studentClass,
                candidateId: candidateId
            })
        });
        const result = await res.json();
        alert(result.message);
        if(result.ok) loadData();
    } catch(err) {
        alert('Lỗi kết nối hệ thống.');
    }
}

// Mở Admin modal
function openAdmin() {
    document.getElementById('adminModal').style.display = 'flex';
}
function closeAdminModal() {
    document.getElementById('adminModal').style.display = 'none';
}
function verifyAdmin() {
    const pass = document.getElementById('adminPasswordInput').value;
    if (pass === ADMIN_PASS) {
        document.getElementById('adminModal').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        alert('Đăng nhập quản trị thành công!');
    } else {
        alert('Sai mật khẩu quản trị!');
    }
}

// Admin: Cập nhật cấu hình
document.getElementById('settingsForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const title = document.getElementById('adminTitle').value;
    const bgImage = document.getElementById('adminBgImage').value;
    const maxVotes = document.getElementById('adminMaxVotes').value;

    const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({
            action: 'updateSettings',
            key: ADMIN_PASS,
            title, bgImage, maxVotes
        })
    });
    const data = await res.json();
    if(data.ok) {
        alert('Đã lưu cấu hình thành công!');
        loadData();
    }
});

// Admin: Thêm đối tượng
document.getElementById('candidateForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('candName').value;
    const image = document.getElementById('candImage').value;

    const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({
            action: 'addCandidate',
            key: ADMIN_PASS,
            name, image
        })
    });
    const data = await res.json();
    if(data.ok) {
        alert('Thêm đối tượng thành công!');
        document.getElementById('candName').value = '';
        document.getElementById('candImage').value = '';
        loadData();
    }
});

// Admin: Xóa đối tượng
async function deleteCandidate(id) {
    if(!confirm('Bạn có chắc muốn xóa đối tượng này?')) return;
    const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({
            action: 'deleteCandidate',
            key: ADMIN_PASS,
            id
        })
    });
    const data = await res.json();
    if(data.ok) loadData();
}

loadData();
</script>
